<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio de Luz y Visión — Módulos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a1a; color: #e0e0ff; min-height: 100vh;
    background-image: radial-gradient(ellipse at center, #1a1a3a 0%, #050510 100%);
    padding: 20px;
  }
  h1 {
    text-align: center; margin-bottom: 8px; font-size: clamp(1.4rem, 4vw, 1.9rem);
    background: linear-gradient(135deg, #66ddff, #ff66aa, #ffcc00);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; color: #aabbdd; margin-bottom: 20px; font-size: 0.9rem; }
  #module-nav {
    max-width: 1200px; margin: 0 auto 20px;
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    background: rgba(20,20,50,0.6); border: 1px solid rgba(100,100,200,0.3);

  }
  .module-toggle {
    display: flex; align-items: center; gap: 8px;

    cursor: pointer; transition: all 0.2s; user-select: none;
  }
  .module-toggle:hover { background: rgba(50,50,90,0.9); }
  .module-toggle.active {
    background: linear-gradient(135deg, #3a3a7a, #2a2a5a);

    box-shadow: 0 0 12px rgba(100,200,255,0.3);
  }
  .module-toggle input { accent-color: #66ddff; }
  #modules-root { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .module {
    background: rgba(20,20,50,0.85); border: 1px solid rgba(100,100,200,0.3);
    border-radius: 16px; padding: 20px; backdrop-filter: blur(10px);
  }
  .module h2 { font-size: 1.1rem; color: #aaccff; margin-bottom: 12px; }
  .module .desc { font-size: 0.85rem; color: #8899bb; margin-bottom: 12px; line-height: 1.5; }
  canvas { width: 100%; height: auto; border-radius: 8px; background: #04040a; display: block; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .controls button {
    padding: 8px 14px; border-radius: 6px; border: 1px solid rgba(150,150,220,0.4);
    background: rgba(30,30,60,0.9); color: #fff; cursor: pointer; font-size: 0.85rem;
  }
  .controls button:hover { background: rgba(50,50,90,0.9); }
  .controls button.active { background: linear-gradient(135deg, #3a3a7a, #2a2a5a); border-color: #66ddff; }
  .param-group {

  }
  .param-group label { flex: 0 0 140px; font-size: 0.85rem; color: #aaccff; }
  .param-group input[type="range"] { flex: 1; }
  .param-group span { flex: 0 0 70px; text-align: right; color: #ffcc00; font-family: monospace; font-size: 0.85rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 750px) { .grid-2 { grid-template-columns: 1fr; } }
  .comparison-label { text-align: center; font-size: 0.8rem; color: #8899bb; margin-top: 4px; }
  .canvas-toolbar { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .canvas-toolbar button {
    font-size: 0.75rem; padding: 4px 10px;
    background: rgba(30,30,60,0.9); color: #aaccff;
    border: 1px solid rgba(150,150,220,0.3); border-radius: 5px; cursor: pointer;
  }
  .canvas-toolbar button:hover { background: rgba(50,50,90,0.9); }
  .info-line {
    font-family: 'Courier New', monospace; font-size: 0.75rem; color: #99bbee;
    margin-top: 8px; background: #0a0a18; padding: 8px; border-radius: 6px;
    line-height: 1.5;
  }
  #test-results {
    max-width: 1200px; margin: 30px auto 0;
    background: rgba(20,20,50,0.85); border: 1px solid rgba(100,100,200,0.3);
    border-radius: 16px; padding: 16px;
    font-family: 'Courier New', monospace; font-size: 0.8rem;
  }
  #test-results h3 { color: #aaccff; margin-bottom: 10px; font-size: 0.95rem; }
  .test-ok { color: #66ffa0; }
  .test-fail { color: #ff6666; }
  footer { text-align: center; margin-top: 30px; color: #556; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>🔬 Laboratorio de Luz y Visión</h1>
<p class="subtitle">Módulos independientes y combinables · Arquitectura hexagonal · Un solo archivo</p>

<nav id="module-nav"></nav>
<main id="modules-root"></main>

<section id="test-results" style="display:none">
  <h3>🧪 Resultados de tests</h3>
  <div id="test-list"></div>
</section>

<footer>
  Cada módulo es autónomo. Se activan y desactivan desde arriba.
  La arquitectura permite copiar cada sección a un archivo .js independiente sin reescribir nada.
</footer>

<script>
// ============================================================================
// SECCIÓN 0 — UTILIDADES
// ============================================================================

/** Bus de eventos simple. Mediador entre módulos sin acoplamiento. */
class EventBus {
  constructor() { this.listeners = new Map(); }
  on(evt, cb) {
    if (!this.listeners.has(evt)) this.listeners.set(evt, new Set());
    this.listeners.get(evt).add(cb);
  }
  off(evt, cb) { if (this.listeners.has(evt)) this.listeners.get(evt).delete(cb); }
  emit(evt, payload) {
    const cbs = this.listeners.get(evt);
    if (cbs) cbs.forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
  }
}

/**
 * Longitud de onda (nm) → color RGB aproximado.
 * Algoritmo de Dan Bruton (1996). Aproxima la respuesta de los conos humanos.
 * No es física: es percepción. La onda tiene frecuencia; el color lo pone el ojo.
 */
function wavelengthToRGB(nm) {
  let R = 0, G = 0, B = 0;
  if (nm >= 380 && nm < 440) { R = -(nm - 440) / 60; B = 1; }
  else if (nm >= 440 && nm < 490) { G = (nm - 440) / 50; B = 1; }
  else if (nm >= 490 && nm < 510) { G = 1; B = -(nm - 510) / 20; }
  else if (nm >= 510 && nm < 580) { R = (nm - 510) / 70; G = 1; }
  else if (nm >= 580 && nm < 645) { R = 1; G = -(nm - 645) / 65; }
  else if (nm >= 645 && nm <= 780) { R = 1; }
  let f = 1;
  if (nm >= 380 && nm < 420) f = 0.3 + 0.7 * (nm - 380) / 40;
  else if (nm > 700 && nm <= 780) f = 0.3 + 0.7 * (780 - nm) / 80;
  return [
    Math.round(255 * Math.pow(R * f, 0.8)),
    Math.round(255 * Math.pow(G * f, 0.8)),
    Math.round(255 * Math.pow(B * f, 0.8)),
  ];
}

// ============================================================================
// SECCIÓN 1 — REGISTRO DE MÓDULOS
// ============================================================================
// Cada módulo se registra aquí. Un módulo declara:
//   - id, nombre, dependencias
//   - mount(ctx): construye su DOM, llamado al activarse
//   - unmount(ctx): limpia, llamado al desactivarse
//   - frame(ctx): opcional, se llama cada frame si está activo
//   - api: opcional, funciones públicas para otros módulos
// El registro NO conoce el DOM ni la simulación. Solo almacena.

const ModuleRegistry = (() => {
  const modules = new Map();
  return {
    add(id, def) { modules.set(id, { id, ...def }); },
    get(id) { return modules.get(id); },
    all() { return [...modules.values()]; },
    clear() { modules.clear(); },
  };
})();

// ============================================================================
// SECCIÓN 2 — ORQUESTADOR
// ============================================================================
// Monta la UI, gestiona activación/desactivación, respeta dependencias,
// llama a mount/unmount/frame en el momento adecuado.

class Orchestrator {
  constructor(registry, navEl, rootEl) {
    this.registry = registry;
    this.navEl = navEl;
    this.rootEl = rootEl;
    this.bus = new EventBus();
    this.ctx = { bus: this.bus, orchestrator: this };
    this.active = new Map();
  }

  boot() {
    for (const mod of this.registry.all()) {
      const label = document.createElement('label');
      label.className = 'module-toggle';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = mod.activoPorDefecto !== false;
      cb.dataset.id = mod.id;
      const span = document.createElement('span');
      span.textContent = mod.nombre;
      label.appendChild(cb);
      label.appendChild(span);
      label.dataset.id = mod.id;
      if (cb.checked) label.classList.add('active');
      cb.addEventListener('change', () => {
        label.classList.toggle('active', cb.checked);
        if (cb.checked) this.activate(mod.id);
        else this.deactivate(mod.id);
      });
      this.navEl.appendChild(label);
    }
    for (const mod of this.registry.all()) {
      if (mod.activoPorDefecto !== false) this.activate(mod.id);
    }
    this._startLoop();
  }

  activate(id) {
    if (this.active.has(id)) return;
    const mod = this.registry.get(id);
    if (!mod) return;

    for (const dep of (mod.depende || [])) {
      if (!this.active.has(dep)) {
        this.activate(dep);
        const cb = this.navEl.querySelector(`input[data-id="${dep}"]`);
        if (cb && !cb.checked) {
          cb.checked = true;
          cb.parentElement.classList.add('active');
        }
      }
    }

    const container = document.createElement('div');
    container.className = 'module';
    container.dataset.id = id;
    this.rootEl.appendChild(container);

    const localCtx = { ...this.ctx, container, deps: this._collectAPIs(mod.depende || []) };
    try {
      if (mod.mount) mod.mount(localCtx);
    } catch (e) {
      container.innerHTML = `<p style="color:#f66">Error al montar ${id}: ${e.message}</p>`;
      console.error(e);
      return;
    }

    this.active.set(id, {
      container,
      api: mod.api || null,
      frame: mod.frame || null,
      unmount: mod.unmount || null,
      ctx: localCtx,
    });

    this.bus.emit('module:activated', { id });
  }

  deactivate(id) {
    if (!this.active.has(id)) return;
    const entry = this.active.get(id);
    for (const other of this.registry.all()) {
      if (other.id === id) continue;
      if ((other.depende || []).includes(id) && this.active.has(other.id)) {
        console.warn(`No se puede desactivar ${id}: ${other.id} depende de él.`);
        return;
      }
    }
    if (entry.unmount) {
      try { entry.unmount(entry.ctx); } catch (e) { console.error(e); }
    }
    entry.container.remove();
    this.active.delete(id);
    this.bus.emit('module:deactivated', { id });
  }

  _collectAPIs(deps) {
    const apis = {};
    for (const dep of deps) {
      const e = this.active.get(dep);
      if (e && e.api) apis[dep] = e.api;
    }
    return apis;
  }

  _startLoop() {
    const loop = () => {
      for (const [, entry] of this.active) {
        if (entry.frame) {
          try { entry.frame(entry.ctx); } catch (e) { console.error('Frame error:', e); }
        }
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

// ============================================================================
// SECCIÓN 3 — MÓDULO: em-motor
// ============================================================================
// Motor FDTD 2D modo TM. Grid escalonado, frontera absorbente tipo sponge.
// Genera el campo electromagnético. Otros módulos leen el campo.
// Soporta 5 longitudes de onda: UV(380), azul(450), verde(550), rojo(650), IR(780).

(() => {
  class FDTD {
    constructor(nx, nz) {
      const n = nx * nz;
      this.nx = nx; this.nz = nz;
      this.ez = new Float32Array(n);
      this.hx = new Float32Array(n);
      this.hy = new Float32Array(n);
      this.eps = new Float32Array(n).fill(1);
      this.damp = new Float32Array(n);
      this.time = 0;
      this._buildSponge();
    }
    _buildSponge() {
      const { nx, nz } = this;
      const W = 18, MD = 0.12;
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        const d = Math.min(i, nx - 1 - i, j, nz - 1 - j);
        if (d < W) { const t = (W - d) / W; this.damp[i + j * nx] = MD * t * t * t; }
      }
    }
    setEpsilon(fn) {
      for (let j = 0; j < this.nz; j++) for (let i = 0; i < this.nx; i++) {
        this.eps[i + j * this.nx] = fn(i, j);
      }
    }
    reset() { this.ez.fill(0); this.hx.fill(0); this.hy.fill(0); this.time = 0; }
    step(sourceFn, dt = 0.3535) {
      const { nx, nz, ez, hx, hy, eps, damp } = this;
      for (let j = 0; j < nz - 1; j++) for (let i = 0; i < nx; i++) {
        const idx = i + j * nx;
        hx[idx] -= dt * (ez[idx + nx] - ez[idx]);
      }
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx - 1; i++) {
        const idx = i + j * nx;
        hy[idx] += dt * (ez[idx + 1] - ez[idx]);
      }
      for (let j = 1; j < nz - 1; j++) for (let i = 1; i < nx - 1; i++) {
        const idx = i + j * nx;
        ez[idx] += dt / eps[idx] * ((hy[idx] - hy[idx - 1]) - (hx[idx] - hx[idx - nx]));
        const d = damp[idx];
        if (d) { ez[idx] *= (1 - d); hx[idx] *= (1 - d); hy[idx] *= (1 - d); }
      }
      if (sourceFn) {
        const ci = (nx / 2) | 0, cj = (nz / 2) | 0;
        ez[ci + cj * nx] += sourceFn(this.time);
      }
      this.time += dt;
    }
  }

  const scenarios = {
    vacio(i, j, nx, nz) { return 1; },
    lamina(i, j, nx, nz) { return (i > nx * 0.6 && i < nx * 0.75) ? 4 : 1; },
    prisma(i, j, nx, nz) {
      const x = i / nx, y = j / nz;
      if (x > 0.4 && x < 0.8 && y > 0.2 && y < 0.8) {
        const apex = 0.65, left = 0.4, right = 0.8;
        const h = 1 - Math.abs((x - apex) / (right - left));
        if (y > 0.5 - h * 0.4 && y < 0.5 + h * 0.4) return 4;
      }
      return 1;
    },
    lente(i, j, nx, nz) {
      const cx = nx * 0.65, cy = nz * 0.5;
      const dx = i - cx, dy = j - cy;
      const d2 = dx * dx + dy * dy;
      const R = Math.min(nx, nz) * 0.15;
      return d2 < R * R ? 4 : 1;
    },
  };

  function makeSource(freq) {
    const t0 = 3 / freq, tau = 1.2 / freq;
    return (t) => {
      const a = (t - t0) / tau;
      return Math.sin(2 * Math.PI * freq * (t - t0)) * Math.exp(-a * a);
    };
  }

  const NX = 110, NZ = 90;

  // Tabla extendida: del UV cercano al IR cercano.
  // freq: frecuencia normalizada. eps: ε base (dispersión aproximada).
  // label: nombre humano. nm: longitud de onda.
  const WL_TABLE = {
    380: { freq: 0.065, eps: 4.7, label: 'UV' },
    450: { freq: 0.060, eps: 4.5, label: 'azul' },
    550: { freq: 0.050, eps: 4.0, label: 'verde' },
    650: { freq: 0.040, eps: 3.6, label: 'rojo' },
    780: { freq: 0.033, eps: 3.3, label: 'IR' },
  };

  const sims = [];
  let mode = 'mono';           // 'mono' | 'white' | 'full'
  let scenarioName = 'lamina';
  let wavelengthNm = 550;
  let running = true;
  let stepsPerFrame = 3;

  function buildSims() {
    sims.length = 0;
    let list;
    if (mode === 'full') list = [380, 450, 550, 650, 780];
    else if (mode === 'white') list = [450, 550, 650];
    else list = [wavelengthNm];

    for (const nm of list) {
      const wl = WL_TABLE[nm];
      if (!wl) continue;
      const s = new FDTD(NX, NZ);
      s.wavelengthNm = nm;
      s.label = wl.label;
      s.color = wavelengthToRGB(nm);
      s.source = makeSource(wl.freq);
      s.setEpsilon((i, j) => {
        const base = scenarios[scenarioName](i, j, NX, NZ);
        if (base === 1) return 1;
        return 1 + (base - 1) * (wl.eps / 4.0);
      });
      sims.push(s);
    }
  }

  function resetSims() { for (const s of sims) s.reset(); }

  const api = {
    getFields() {
      return sims.map(s => ({
        field: s.ez, nx: s.nx, nz: s.nz,
        color: s.color, wavelength: s.wavelengthNm, label: s.label,
      }));
    },
    getFieldsByWavelength() {
      const out = {};
      for (const s of sims) {
        out[s.wavelengthNm] = {
          field: s.ez, nx: s.nx, nz: s.nz,
          color: s.color, label: s.label, wavelengthNm: s.wavelengthNm,
        };
      }
      return out;
    },
    setScenario(name) { scenarioName = name; buildSims(); },
    setWavelength(nm) { wavelengthNm = nm; mode = 'mono'; buildSims(); },
    setMode(m) { mode = m; buildSims(); },
    setModeFull() { mode = 'full'; buildSims(); },
    setRunning(r) { running = r; },
    isRunning() { return running; },
    reset() { resetSims(); },
    getScenario() { return scenarioName; },
    getMode() { return mode; },
    getWavelength() { return wavelengthNm; },
    getActiveWavelengths() { return sims.map(s => s.wavelengthNm); },
  };

  ModuleRegistry.add('em-motor', {
    nombre: '⚡ Motor EM (FDTD)',
    depende: [],
    activoPorDefecto: true,
    api,
    mount(ctx) {
      ctx.container.innerHTML = `
        <h2>⚡ Motor electromagnético 2D · FDTD (Yee) · Modo TM</h2>
        <div class="desc">
          Resuelve las ecuaciones de Maxwell en 2D sobre un grid escalonado. Genera el campo
          electromagnético que los demás módulos usan. Por sí solo no dibuja nada: expone el
          campo a quien lo pida. Los controles de abajo modifican el medio y la fuente.
          El modo "espectro completo" activa 5 longitudes de onda (UV, azul, verde, rojo, IR)
          para que el módulo de ojo animal tenga material con el que trabajar.
        </div>
        <div class="controls" id="scenario-controls">
          <button data-scenario="vacio">Vacío</button>
          <button data-scenario="lamina" class="active">Lámina dieléctrica</button>
          <button data-scenario="prisma">Prisma</button>
          <button data-scenario="lente">Lente</button>
        </div>
        <div class="controls" id="mode-controls">
          <button data-mode="mono" class="active">Monocromático</button>
          <button data-mode="white">Luz blanca (3 λ)</button>
          <button data-mode="full">Espectro completo (5 λ)</button>
        </div>
        <div class="controls" id="wavelength-controls">
          <button data-wl="650">Rojo 650nm</button>
          <button data-wl="550" class="active">Verde 550nm</button>
          <button data-wl="450">Azul 450nm</button>
        </div>
        <div class="controls">
          <button id="em-reset">Reiniciar simulación</button>
          <button id="em-play">Pausar</button>
        </div>
        <div class="info-line" id="em-info">Configurando…</div>
      `;
      const sc = ctx.container.querySelector('#scenario-controls');
      sc.addEventListener('click', (e) => {
        if (!e.target.dataset.scenario) return;
        sc.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        api.setScenario(e.target.dataset.scenario);
      });
      const mc = ctx.container.querySelector('#mode-controls');
      mc.addEventListener('click', (e) => {
        if (!e.target.dataset.mode) return;
        mc.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        api.setMode(e.target.dataset.mode);
        ctx.container.querySelector('#wavelength-controls').style.opacity =
          e.target.dataset.mode === 'mono' ? 1 : 0.4;
      });
      const wc = ctx.container.querySelector('#wavelength-controls');
      wc.addEventListener('click', (e) => {
        if (!e.target.dataset.wl) return;
        wc.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        api.setWavelength(parseInt(e.target.dataset.wl, 10));
        // Al elegir λ, forzamos modo mono y actualizamos botones
        mc.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === 'mono'));
        wc.style.opacity = 1;
      });
      ctx.container.querySelector('#em-reset').addEventListener('click', () => api.reset());
      const playBtn = ctx.container.querySelector('#em-play');
      playBtn.addEventListener('click', () => {
        running = !running;
        playBtn.textContent = running ? 'Pausar' : 'Reanudar';
      });
      buildSims();
    },
    frame(ctx) {
      if (!running) return;
      for (let k = 0; k < stepsPerFrame; k++) {
        for (const s of sims) s.step(s.source);
      }
      const info = ctx.container.querySelector('#em-info');
      if (info) {
        const wls = sims.map(s => s.wavelengthNm + 'nm').join(', ');
        info.textContent =
          `Escenario: ${scenarioName} · Modo: ${mode} · λ activas: [${wls}] · ` +
          `Grid ${NX}×${NZ} · t = ${sims[0]?.time.toFixed(2) || 0}`;
      }
    },
  });
})();

// ============================================================================
// SECCIÓN 4 — MÓDULO: em-color
// ============================================================================
// Lee el campo del motor EM y lo pinta como lo vería un ojo humano.
// Usa las longitudes de onda visibles (450, 550, 650) si están disponibles.
// Si no lo están, cae al modo mono.

(() => {
  let canvas, ctx2d, imageData, offscreen, offCtx;

  function ensureCanvas(w, h) {
    if (!canvas || canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      offscreen = document.createElement('canvas');
      offscreen.width = w; offscreen.height = h;
      offCtx = offscreen.getContext('2d');
      imageData = offCtx.createImageData(w, h);
    }
  }

  ModuleRegistry.add('em-color', {
    nombre: '🎨 Color (percepción humana)',
    depende: ['em-motor'],
    activoPorDefecto: true,
    mount(c) {
      c.container.innerHTML = `
        <h2>🎨 Color — de onda a percepción</h2>
        <div class="desc">
          El motor EM produce <em>frecuencias</em>. El <strong>color</strong> no está en la onda:
          está en el ojo que la mira. Este módulo aplica la conversión longitud de onda → RGB
          que aproxima la respuesta de los conos humanos. Si el motor está en modo espectro
          completo, aquí solo se muestran las tres longitudes visibles (azul, verde, rojo).
        </div>
        <canvas id="em-color-canvas"></canvas>
        <div class="canvas-toolbar">
          <button data-png="em-color-canvas">💾 Descargar PNG</button>
        </div>
        <div class="info-line" id="color-info">Esperando datos del motor…</div>
      `;
      canvas = c.container.querySelector('#em-color-canvas');
      ctx2d = canvas.getContext('2d');
      c.container.querySelector('[data-png]').addEventListener('click', () => {
        const a = document.createElement('a');
        a.download = 'em-color.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    },
    frame(c) {
      const motor = c.deps['em-motor'];
      if (!motor) return;
      const fields = motor.getFields();
      if (!fields.length) return;

      // Filtrar a las longitudes visibles si el motor tiene más
      const visible = fields.filter(f => [450, 550, 650].includes(f.wavelength));
      const toDraw = visible.length > 0 ? visible : fields;

      ensureCanvas(toDraw[0].nx, toDraw[0].nz);
      const data = imageData.data;

      let maxV = 1e-20;
      for (const f of toDraw) {
        for (let k = 0; k < f.field.length; k++) {
          const a = Math.abs(f.field[k]);
          if (a > maxV) maxV = a;
        }
      }
      const inv = 1 / maxV;

      const N = toDraw[0].field.length;
      for (let k = 0; k < N; k++) {
        let r = 0, g = 0, b = 0;
        for (const f of toDraw) {
          const v = Math.min(1, Math.abs(f.field[k]) * inv);
          r += f.color[0] * v;
          g += f.color[1] * v;
          b += f.color[2] * v;
        }
        const p = k * 4;
        data[p] = Math.min(255, r);
        data[p + 1] = Math.min(255, g);
        data[p + 2] = Math.min(255, b);
        data[p + 3] = 255;
      }
      offCtx.putImageData(imageData, 0, 0);
      ctx2d.imageSmoothingEnabled = true;
      ctx2d.drawImage(offscreen, 0, 0, canvas.width, canvas.height);

      const info = c.container.querySelector('#color-info');
      if (info) {
        const wls = toDraw.map(f => f.wavelength + 'nm').join(', ');
        info.textContent = `Longitudes visibles usadas: ${wls} · ` +
          `modo motor: ${motor.getMode()}`;
      }
    },
  });
})();

// ============================================================================
// SECCIÓN 5 — MÓDULO: percepcion
// ============================================================================
// Simula cómo ve el mundo una persona con distintas condiciones visuales.
// Trabaja con imágenes. Diez condiciones. Comparación lado a lado, slider
// de severidad, toggle de compensación, modo parpadeo A/B, descarga PNG.

(() => {
  // ------------------------------------------------------------------
  // GENERACIÓN DE LA ESCENA DE PRUEBA
  // ------------------------------------------------------------------
  function generateScene(w, h) {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');

    const sky = g.createLinearGradient(0, 0, 0, h * 0.62);
    sky.addColorStop(0, '#5B9BD5');
    sky.addColorStop(0.7, '#B8D4E8');
    sky.addColorStop(1, '#F5DEB3');
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h * 0.62);

    g.fillStyle = '#FFD966';
    g.beginPath(); g.arc(w * 0.82, h * 0.13, Math.min(w, h) * 0.05, 0, Math.PI * 2); g.fill();

    g.fillStyle = '#6B5B4A';
    g.beginPath();
    g.moveTo(0, h * 0.62);
    g.lineTo(w * 0.15, h * 0.38);
    g.lineTo(w * 0.28, h * 0.55);
    g.lineTo(w * 0.42, h * 0.32);
    g.lineTo(w * 0.55, h * 0.52);
    g.lineTo(w * 0.72, h * 0.4);
    g.lineTo(w * 0.88, h * 0.55);
    g.lineTo(w, h * 0.45);
    g.lineTo(w, h * 0.62);
    g.closePath(); g.fill();

    g.fillStyle = '#7CB342';
    g.fillRect(0, h * 0.62, w, h * 0.38);

    g.fillStyle = '#F5DEB3';
    g.fillRect(w * 0.22, h * 0.6, w * 0.16, h * 0.22);
    g.fillStyle = '#A0522D';
    g.beginPath();
    g.moveTo(w * 0.20, h * 0.6);
    g.lineTo(w * 0.30, h * 0.46);
    g.lineTo(w * 0.40, h * 0.6);
    g.closePath(); g.fill();
    g.fillStyle = '#5D4037';
    g.fillRect(w * 0.28, h * 0.72, w * 0.04, h * 0.1);
    g.fillStyle = '#81D4FA';
    g.fillRect(w * 0.24, h * 0.66, w * 0.03, h * 0.03);

    g.fillStyle = '#5D4037';
    g.fillRect(w * 0.72, h * 0.66, w * 0.02, h * 0.16);
    g.fillStyle = '#2E7D32';
    g.beginPath(); g.arc(w * 0.73, h * 0.6, w * 0.06, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(w * 0.68, h * 0.63, w * 0.045, 0, Math.PI * 2); g.fill();

    const faceX = w * 0.5, faceY = h * 0.5, faceR = Math.min(w, h) * 0.08;
    g.fillStyle = '#FFCC99';
    g.beginPath(); g.arc(faceX, faceY, faceR, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#000';
    g.beginPath(); g.arc(faceX - faceR * 0.35, faceY - faceR * 0.2, faceR * 0.1, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(faceX + faceR * 0.35, faceY - faceR * 0.2, faceR * 0.1, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#000'; g.lineWidth = 2;
    g.beginPath(); g.arc(faceX, faceY + faceR * 0.1, faceR * 0.5, 0.2, Math.PI - 0.2); g.stroke();

    g.fillStyle = '#FFFFFF';
    g.font = `bold ${Math.round(h * 0.06)}px sans-serif`;
    g.fillText('TEXTO', w * 0.05, h * 0.95);
    g.font = `${Math.round(h * 0.04)}px sans-serif`;
    g.fillText('abc 123', w * 0.45, h * 0.95);

    // Parches de color saturados
    const patchesY = h * 0.86;
    const patchH = h * 0.08;
    const patches = [
      { color: '#FF0000' }, { color: '#00A000' }, { color: '#FF8000' },
      { color: '#8000FF' }, { color: '#00FFFF' }, { color: '#808000' },
    ];
    const patchW = (w * 0.5) / patches.length;
    patches.forEach((p, i) => {
      g.fillStyle = p.color;
      g.fillRect(w * 0.02 + i * patchW, patchesY, patchW - 2, patchH);
    });

    // Círculos Ishihara simplificados
    const ishiY = h * 0.86 + h * 0.04;
    const ishiR = h * 0.055;
    const ishiPositions = [
      { x: w * 0.62, bg: '#8B4513', fg: '#7CB342', n: '5' },
      { x: w * 0.78, bg: '#FF6347', fg: '#556B2F', n: '3' },
      { x: w * 0.94, bg: '#4169E1', fg: '#9932CC', n: '7' },
    ];
    ishiPositions.forEach(p => {
      g.fillStyle = p.bg;
      g.beginPath(); g.arc(p.x, ishiY, ishiR, 0, Math.PI * 2); g.fill();
      g.fillStyle = p.fg;
      g.font = `bold ${Math.round(ishiR * 1.2)}px sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(p.n, p.x, ishiY);
      g.textAlign = 'start'; g.textBaseline = 'alphabetic';
    });

    return cv;
  }

  // ------------------------------------------------------------------
  // FILTROS
  // ------------------------------------------------------------------
  const filters = {
    normal() { /* nada */ },

    'macular-seca'(g, w, h, sev, comp) {
      const s = sev / 100;
      const cx = w / 2, cy = h / 2;
      const R = Math.min(w, h) * (0.15 + 0.15 * s);
      if (s > 0.1) {
        const snap = document.createElement('canvas');
        snap.width = w; snap.height = h;
        snap.getContext('2d').drawImage(g.canvas, 0, 0);
        g.save();
        g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
        g.filter = `blur(${2 + 8 * s}px)`;
        g.drawImage(snap, 0, 0);
        g.filter = 'none';
        g.restore();
      }
      const grad = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
      grad.addColorStop(0, `rgba(0,0,0,${0.3 + 0.6 * s})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'overlay';
        g.fillStyle = 'rgba(255,255,255,0.15)';
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    'macular-humeda'(g, w, h, sev, comp) {
      const s = sev / 100;
      const cx = w / 2, cy = h / 2;
      const R = Math.min(w, h) * (0.15 + 0.1 * s);
      const snap = document.createElement('canvas');
      snap.width = w; snap.height = h;
      snap.getContext('2d').drawImage(g.canvas, 0, 0);
      const srcCtx = snap.getContext('2d');
      const src = srcCtx.getImageData(0, 0, w, h);
      const dst = g.createImageData(w, h);
      const srcD = src.data, dstD = dst.data;
      const k = 0.3 * s;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const dx = x - cx, dy = y - cy;
          const d = Math.hypot(dx, dy);
          const idx = (y * w + x) * 4;
          if (d < R && d > 0.1) {
            const theta = Math.atan2(dy, dx);
            const wave = 1 + k * Math.sin(d * 0.4);
            const nx2 = cx + Math.cos(theta) * d * wave;
            const ny2 = cy + Math.sin(theta) * d * wave;
            const sx = Math.max(0, Math.min(w - 1, Math.round(nx2)));
            const sy = Math.max(0, Math.min(h - 1, Math.round(ny2)));
            const si = (sy * w + sx) * 4;
            dstD[idx] = srcD[si];
            dstD[idx + 1] = srcD[si + 1];
            dstD[idx + 2] = srcD[si + 2];
            dstD[idx + 3] = 255;
          } else {
            dstD[idx] = srcD[idx];
            dstD[idx + 1] = srcD[idx + 1];
            dstD[idx + 2] = srcD[idx + 2];
            dstD[idx + 3] = 255;
          }
        }
      }
      g.putImageData(dst, 0, 0);
      const grad = g.createRadialGradient(cx, cy, R * 0.3, cx, cy, R);
      grad.addColorStop(0, `rgba(0,0,0,${0.2 + 0.5 * s})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'overlay';
        g.fillStyle = 'rgba(255,255,255,0.15)';
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    glaucoma(g, w, h, sev, comp) {
      const s = sev / 100;
      const cx = w / 2, cy = h / 2;
      const outer = Math.hypot(w, h) / 2;
      const inner = outer * (0.9 - 0.7 * s);
      const grad = g.createRadialGradient(cx, cy, inner, cx, cy, outer);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.98)');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'screen';
        const g2 = g.createRadialGradient(cx, cy, 0, cx, cy, inner);
        g2.addColorStop(0, 'rgba(255,255,255,0.2)');
        g2.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = g2;
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    cataratas(g, w, h, sev, comp) {
      const s = sev / 100;
      if (s > 0.05) {
        const snap = document.createElement('canvas');
        snap.width = w; snap.height = h;
        snap.getContext('2d').drawImage(g.canvas, 0, 0);
        g.filter = `blur(${1 + 6 * s}px)`;
        g.drawImage(snap, 0, 0);
        g.filter = 'none';
      }
      g.save();
      g.globalCompositeOperation = 'multiply';
      g.fillStyle = `rgba(255, 230, 150, ${0.15 + 0.35 * s})`;
      g.fillRect(0, 0, w, h);
      g.restore();
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'overlay';
        g.fillStyle = `rgba(100,100,255,${0.1 + 0.15 * s})`;
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    retinosis(g, w, h, sev, comp) {
      const s = sev / 100;
      const cx = w / 2, cy = h / 2;
      const outer = Math.hypot(w, h) / 2;
      const inner = outer * (0.85 - 0.55 * s);
      const grad = g.createRadialGradient(cx, cy, inner, cx, cy, outer);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.7, `rgba(0,0,0,${0.5 + 0.3 * s})`);
      grad.addColorStop(1, `rgba(0,0,0,${0.85 + 0.15 * s})`);
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'screen';
        const g2 = g.createRadialGradient(cx, cy, 0, cx, cy, inner);
        g2.addColorStop(0, 'rgba(255,255,255,0.15)');
        g2.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = g2;
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    daltonismo(g, w, h, sev, comp, subtype) {
      const s = sev / 100;
      const img = g.getImageData(0, 0, w, h);
      const d = img.data;
      const M = {
        protanopia:   [[0.567, 0.433, 0], [0.558, 0.442, 0], [0, 0.242, 0.758]],
        deuteranopia: [[0.625, 0.375, 0], [0.7, 0.3, 0], [0, 0.3, 0.7]],
        tritanopia:   [[0.95, 0.05, 0], [0, 0.433, 0.567], [0, 0.475, 0.525]],
      };
      const mat = M[subtype] || M.protanopia;
      const id = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
      const blend = (i, j) => id[i][j] * (1 - s) + mat[i][j] * s;
      const b00 = blend(0, 0), b01 = blend(0, 1), b02 = blend(0, 2);
      const b10 = blend(1, 0), b11 = blend(1, 1), b12 = blend(1, 2);
      const b20 = blend(2, 0), b21 = blend(2, 1), b22 = blend(2, 2);
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], gg = d[i + 1], b = d[i + 2];
        d[i]     = Math.max(0, Math.min(255, b00 * r + b01 * gg + b02 * b));
        d[i + 1] = Math.max(0, Math.min(255, b10 * r + b11 * gg + b12 * b));
        d[i + 2] = Math.max(0, Math.min(255, b20 * r + b21 * gg + b22 * b));
      }
      g.putImageData(img, 0, 0);
      if (comp) {
        const img2 = g.getImageData(0, 0, w, h);
        const d2 = img2.data;
        const boost = 1.4;
        for (let i = 0; i < d2.length; i += 4) {
          d2[i]     = Math.min(255, 128 + (d2[i] - 128) * boost);
          d2[i + 1] = Math.min(255, 128 + (d2[i + 1] - 128) * boost);
        }
        g.putImageData(img2, 0, 0);
      }
    },

    hemianopsia(g, w, h, sev, comp, subtype) {
      const s = sev / 100;
      const side = subtype || 'derecha';
      g.fillStyle = `rgba(0,0,0,${0.7 + 0.3 * s})`;
      if (side === 'izquierda') {
        g.fillRect(0, 0, w * (0.4 + 0.4 * s), h);
      } else {
        g.fillRect(w * (0.6 - 0.4 * s), 0, w, h);
      }
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'screen';
        g.fillStyle = 'rgba(255,200,100,0.15)';
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    'retinopatia'(g, w, h, sev, comp) {
      const s = sev / 100;
      let seed = 12345;
      const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      const n = Math.round(8 + 30 * s);
      for (let i = 0; i < n; i++) {
        const x = rand() * w;
        const y = rand() * h;
        const r = (2 + rand() * 6) * (0.5 + s);
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, `rgba(80,0,0,${0.4 + 0.4 * s})`);
        grad.addColorStop(1, 'rgba(80,0,0,0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      }
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'overlay';
        g.fillStyle = 'rgba(255,255,255,0.1)';
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    astigmatismo(g, w, h, sev, comp, subtype) {
      const s = sev / 100;
      if (s < 0.05) return;
      const dir = subtype || 'horizontal';
      const snap = document.createElement('canvas');
      snap.width = w; snap.height = h;
      snap.getContext('2d').drawImage(g.canvas, 0, 0);
      g.save();
      g.globalAlpha = 1 / 12;
      const pixels = 2 + s * 10;
      for (let k = -pixels; k <= pixels; k++) {
        const dx = dir === 'horizontal' ? k : 0;
        const dy = dir === 'vertical' ? k : 0;
        g.drawImage(snap, dx, dy);
      }
      g.restore();
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'overlay';
        g.fillStyle = 'rgba(255,255,255,0.12)';
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },
  };

  const STATE = {
    condition: 'normal',
    severity: 50,
    compensation: false,
    daltonSubtype: 'tritanopia',
    hemianSubtype: 'derecha',
    astigSubtype: 'horizontal',
    sourceCanvas: null,
    flickering: false,
    flickerInterval: null,
  };

  const RECOMMENDED_SEVERITY = {
    normal: 0, 'macular-seca': 50, 'macular-humeda': 50, glaucoma: 60,
    cataratas: 55, retinosis: 60, daltonismo: 90, hemianopsia: 70,
    retinopatia: 55, astigmatismo: 45,
  };

  const COND_NAMES = {
    normal: 'Normal',
    'macular-seca': 'Degeneración macular (seca)',
    'macular-humeda': 'Degeneración macular (húmeda)',
    glaucoma: 'Glaucoma (visión en túnel)',
    cataratas: 'Cataratas',
    retinosis: 'Retinosis pigmentaria',
    daltonismo: 'Daltonismo',
    hemianopsia: 'Hemianopsia',
    retinopatia: 'Retinopatía diabética',
    astigmatismo: 'Astigmatismo',
  };

  function renderSim(c, overrideCondition) {
    const cs = c.container.querySelector('#canvas-sim');
    const info = c.container.querySelector('#perception-info');
    const label = c.container.querySelector('#sim-label');
    const g = cs.getContext('2d');

    g.clearRect(0, 0, cs.width, cs.height);
    g.drawImage(STATE.sourceCanvas, 0, 0);

    const cond = overrideCondition || STATE.condition;
    const filter = filters[cond];
    if (filter) {
      try {
        filter(
          g, cs.width, cs.height, STATE.severity, STATE.compensation,
          cond === 'daltonismo' ? STATE.daltonSubtype
            : cond === 'hemianopsia' ? STATE.hemianSubtype
            : cond === 'astigmatismo' ? STATE.astigSubtype
            : undefined
        );
      } catch (e) { console.error('Error al aplicar filtro:', e); }
    }

    let subtitle = '';
    if (cond === 'daltonismo') subtitle = ` (${STATE.daltonSubtype})`;
    if (cond === 'hemianopsia') subtitle = ` (${STATE.hemianSubtype})`;
    if (cond === 'astigmatismo') subtitle = ` (${STATE.astigSubtype})`;

    if (label) {
      label.textContent = `Simulación: ${COND_NAMES[cond]}${subtitle}` +
        (STATE.compensation ? ' · con compensación' : '');
    }
    if (info) {
      info.textContent =
        `Condición: ${COND_NAMES[cond]}${subtitle} · ` +
        `Severidad: ${STATE.severity}% · ` +
        `Compensación: ${STATE.compensation ? 'ON' : 'OFF'}` +
        (STATE.flickering ? ' · Parpadeo A/B activo' : '');
    }
  }

  function startFlicker(c) {
    if (STATE.flickerInterval) return;
    let showOriginal = false;
    STATE.flickerInterval = setInterval(() => {
      showOriginal = !showOriginal;
      renderSim(c, showOriginal ? 'normal' : STATE.condition);
    }, 800);
    STATE.flickering = true;
  }

  function stopFlicker(c) {
    if (STATE.flickerInterval) {
      clearInterval(STATE.flickerInterval);
      STATE.flickerInterval = null;
    }
    STATE.flickering = false;
    renderSim(c);
  }

  ModuleRegistry.add('percepcion', {
    nombre: '👁 Percepción visual',
    depende: [],
    activoPorDefecto: true,
    mount(c) {
      c.container.innerHTML = `
        <h2>👁 Percepción visual — condiciones y compensación</h2>
        <div class="desc">
          Muestra cómo ve el mundo una persona con distintas condiciones visuales.
          Compara lado a lado <strong>normal</strong> vs <strong>simulado</strong>.
          Activa <em>compensación</em> para ver intentos de mejora.
          Usa <em>parpadeo A/B</em> para notar diferencias sutiles (sobre todo daltonismo).
          <strong>Aviso:</strong> educativo, no diagnóstico.
        </div>
        <div class="controls" id="cond-controls">
          <button data-cond="normal" class="active">Normal</button>
          <button data-cond="macular-seca">Macular seca</button>
          <button data-cond="macular-humeda">Macular húmeda</button>
          <button data-cond="glaucoma">Glaucoma</button>
          <button data-cond="cataratas">Cataratas</button>

    },

  function translateField(fieldsByWl, animal, outImageData, w, h) {
    const channels = animal.channels;
    const nCh = channels.length;
    const data = outImageData.data;
    const N = w * h;

    const pixBuf = new Float32Array(N * nCh);
    let maxV = 1e-20;

    for (let ch = 0; ch < nCh; ch++) {
      const chan = channels[ch];
      for (const nmStr in chan.weights) {
        const w_ = chan.weights[nmStr];
        if (w_ === 0) continue;
        const nm = parseInt(nmStr, 10);
        const f = fieldsByWl[nm];
        if (!f) continue;
        const field = f.field;
        for (let k = 0; k < N; k++) {
          const v = Math.abs(field[k]);
          pixBuf[k * nCh + ch] += v * w_;
          if (pixBuf[k * nCh + ch] > maxV) maxV = pixBuf[k * nCh + ch];
        }
      }
    }
    const inv = 1 / maxV;

    for (let k = 0; k < N; k++) {
      let r = 0, g = 0, b = 0;
      for (let ch = 0; ch < nCh; ch++) {
        const val = pixBuf[k * nCh + ch] * inv;
        if (val <= 0.001) continue;
        const rgb = channels[ch].rgb;
        r += rgb[0] * val;
        g += rgb[1] * val;
        b += rgb[2] * val;
      }
      const p = k * 4;
      data[p]     = Math.min(255, r);
      data[p + 1] = Math.min(255, g);
      data[p + 2] = Math.min(255, b);
      data[p + 3] = 255;
    }
  }

  let canvasA, canvasB, ctxA, ctxB;
  let imgA, imgB;
  let offA, offB, offCtxA, offCtxB;
  let currentAnimal = 'abeja';

  function ensureBuffers(w, h) {
    if (!offA || offA.width !== w) {
      offA = document.createElement('canvas');
      offA.width = w; offA.height = h;
      offCtxA = offA.getContext('2d');
      imgA = offCtxA.createImageData(w, h);
      offB = document.createElement('canvas');
      offB.width = w; offB.height = h;
      offCtxB = offB.getContext('2d');
      imgB = offCtxB.createImageData(w, h);
    }
  }

  ModuleRegistry.add('ojo-animal', {
    nombre: '🦅 Ojo animal',
    depende: ['em-motor'],
    activoPorDefecto: false,
    api: {
      getAnimals() { return ANIMALS; },

          </div>
          <div>
            <canvas id="canvas-animal"></canvas>
            <div class="comparison-label" id="animal-label">Ojo animal</div>
            <div class="canvas-toolbar"><button data-png="canvas-animal">💾 PNG</button></div>
          </div>
        </div>
        <div class="info-line" id="animal-info">Elige un animal…</div>
        <div class="info-line" id="animal-channels" style="margin-top:6px;"></div>
      `;

      const cc = c.container.querySelector('#animal-controls');
      for (const id in ANIMALS) {
        const btn = document.createElement('button');
        btn.textContent = ANIMALS[id].nombre;
        btn.dataset.animal = id;
        if (id === currentAnimal) btn.classList.add('active');
        btn.addEventListener('click', () => {
          cc.querySelectorAll('button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentAnimal = id;
          updateLabels(c);
        });
        cc.appendChild(btn);
      }

      canvasA = c.container.querySelector('#canvas-human');
      canvasB = c.container.querySelector('#canvas-animal');
      ctxA = canvasA.getContext('2d');
      ctxB = canvasB.getContext('2d');

      c.container.querySelectorAll('[data-png]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = c.container.querySelector('#' + btn.dataset.png);
          const a = document.createElement('a');
          a.download = btn.dataset.png + '.png';
          a.href = target.toDataURL('image/png');
          a.click();
        });
      });

      updateLabels(c);
    },

    frame(c) {
      const motor = c.deps['em-motor'];
      if (!motor) return;
      const fieldsByWl = motor.getFieldsByWavelength();
      const wls = Object.keys(fieldsByWl);
      if (wls.length === 0) return;

      const anyField = fieldsByWl[wls[0]];
      const w = anyField.nx, h = anyField.nz;
      ensureBuffers(w, h);

      if (canvasA.width !== w) {
        canvasA.width = canvasB.width = w;
        canvasA.height = canvasB.height = h;
      }

      // Canvas A: humano (usando 450/550/650 si están)
      const dataA = imgA.data;
      const N = w * h;
      let maxA = 1e-20;
      for (const nm of ['450', '550', '650']) {
        if (!fieldsByWl[nm]) continue;
        const f = fieldsByWl[nm].field;
        for (let k = 0; k < N; k++) {
          const a = Math.abs(f[k]);
          if (a > maxA) maxA = a;
        }
      }
      const invA = 1 / maxA;
      for (let k = 0; k < N; k++) {
        let r = 0, g = 0, b = 0;
        if (fieldsByWl['450']) {
          const v = Math.min(1, Math.abs(fieldsByWl['450'].field[k]) * invA);
          b += 255 * v;
        }
        if (fieldsByWl['550']) {
          const v = Math.min(1, Math.abs(fieldsByWl['550'].field[k]) * invA);
          g += 255 * v;
        }
        if (fieldsByWl['650']) {
          const v = Math.min(1, Math.abs(fieldsByWl['650'].field[k]) * invA);
          r += 255 * v;
        }
        const p = k * 4;
        dataA[p] = r; dataA[p + 1] = g; dataA[p + 2] = b; dataA[p + 3] = 255;
      }
      offCtxA.putImageData(imgA, 0, 0);
      ctxA.imageSmoothingEnabled = true;
      ctxA.drawImage(offA, 0, 0, canvasA.width, canvasA.height);

      // Canvas B: animal seleccionado
      const animal = ANIMALS[currentAnimal];
      translateField(fieldsByWl, animal, imgB, w, h);
      offCtxB.putImageData(imgB, 0, 0);
      ctxB.imageSmoothingEnabled = true;
      ctxB.drawImage(offB, 0, 0, canvasB.width, canvasB.height);
    },
  });

  function updateLabels(c) {
    const animal = ANIMALS[currentAnimal];
    const lbl = c.container.querySelector('#animal-label');
    const info = c.container.querySelector('#animal-info');
    const chInfo = c.container.querySelector('#animal-channels');

    if (lbl) lbl.textContent = `${animal.nombre} — ${animal.tipo}`;
    if (info) info.textContent = animal.desc + ' · ' + animal.note;
    if (chInfo) {
      chInfo.innerHTML = animal.channels
        .map(ch => {
          const r = ch.rgb[0], g = ch.rgb[1], b = ch.rgb[2];
          return `<span style="display:inline-block;width:10px;height:10px;background:rgb(${r},${g},${b});border-radius:2px;margin-right:4px;vertical-align:middle;"></span>${ch.name}`;
        })
        .join(' · ');
    }
  }
})();

// ============================================================================
// SECCIÓN 6 — TESTS
// ============================================================================
// Se ejecutan al cargar. Los resultados van a consola y a un panel abajo.

function runTests() {
  const results = [];
  const test = (name, fn) => {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, error: e.message }); }
  };
  const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

  // ---- EventBus ----
  test('EventBus: on/emit recibe payload', () => {
    const bus = new EventBus();
    let received = null;
    bus.on('evt', (p) => { received = p; });
    bus.emit('evt', { x: 42 });
    assert(received && received.x === 42, 'payload no recibido');
  });

  test('EventBus: off desuscribe', () => {
    const bus = new EventBus();
    let count = 0;
    const cb = () => { count++; };
    bus.on('evt', cb);
    bus.emit('evt');
    bus.off('evt', cb);
    bus.emit('evt');
    assert(count === 1, `esperado 1, recibido ${count}`);
  });

  // ---- wavelengthToRGB ----
  test('wavelengthToRGB: 550nm dominante verde', () => {
    const [r, g, b] = wavelengthToRGB(550);
    assert(g > r && g > b, `no dominante verde: ${r},${g},${b}`);
  });

  test('wavelengthToRGB: 650nm dominante rojo', () => {
    const [r, g, b] = wavelengthToRGB(650);
    assert(r > g && r > b, `no dominante rojo: ${r},${g},${b}`);
  });

  test('wavelengthToRGB: 450nm dominante azul', () => {
    const [r, g, b] = wavelengthToRGB(450);
    assert(b > r && b > g, `no dominante azul: ${r},${g},${b}`);
  });

  test('wavelengthToRGB: fuera de rango devuelve negro', () => {
    const [r, g, b] = wavelengthToRGB(200);
    assert(r === 0 && g === 0 && b === 0, `no negro: ${r},${g},${b}`);
  });

  // ---- ModuleRegistry ----
  test('ModuleRegistry: add/get/all', () => {
    const saved = [...ModuleRegistry.all()];
    ModuleRegistry.clear();
    ModuleRegistry.add('test-a', { nombre: 'A' });
    ModuleRegistry.add('test-b', { nombre: 'B' });
    assert(ModuleRegistry.all().length === 2, 'no hay 2 módulos');
    assert(ModuleRegistry.get('test-a').nombre === 'A', 'get falla');
    assert(ModuleRegistry.get('no-existe') === undefined, 'get debería ser undefined');
    ModuleRegistry.clear();
    for (const m of saved) ModuleRegistry.add(m.id, m);
  });

  // ---- Módulos registrados ----
  test('Módulo em-motor registrado con API completa', () => {
    const mod = ModuleRegistry.get('em-motor');
    assert(mod, 'em-motor no registrado');
    assert(typeof mod.api.getFields === 'function', 'getFields ausente');
    assert(typeof mod.api.getFieldsByWavelength === 'function', 'getFieldsByWavelength ausente');
    assert(typeof mod.api.setScenario === 'function', 'setScenario ausente');
    assert(typeof mod.api.setWavelength === 'function', 'setWavelength ausente');
    assert(typeof mod.api.setMode === 'function', 'setMode ausente');
    assert(typeof mod.api.setModeFull === 'function', 'setModeFull ausente');
    assert(typeof mod.api.reset === 'function', 'reset ausente');
  });

  test('Módulo em-color depende de em-motor', () => {
    const mod = ModuleRegistry.get('em-color');
    assert(mod, 'em-color no registrado');
    assert(mod.depende.includes('em-motor'), 'falta dependencia');
  });

  test('Módulo percepcion registrado y autónomo', () => {
    const mod = ModuleRegistry.get('percepcion');
    assert(mod, 'percepcion no registrado');
    assert((mod.depende || []).length === 0, 'no debería tener dependencias');
    assert(typeof mod.mount === 'function', 'mount no es función');
  });

  test('Módulo ojo-animal depende de em-motor', () => {
    const mod = ModuleRegistry.get('ojo-animal');
    assert(mod, 'ojo-animal no registrado');
    assert(mod.depende.includes('em-motor'), 'falta dependencia');
    assert(typeof mod.api.getAnimals === 'function', 'getAnimals ausente');
  });

  // ---- Verificaciones sobre la tabla de animales ----
  test('Tabla de animales: al menos 10 animales distintos', () => {
    const mod = ModuleRegistry.get('ojo-animal');
    const animals = mod.api.getAnimals();
    const keys = Object.keys(animals);
    assert(keys.length >= 10, `solo hay ${keys.length} animales`);
  });

  test('Cada animal tiene nombre, canales y nota', () => {
    const mod = ModuleRegistry.get('ojo-animal');
    const animals = mod.api.getAnimals();
    for (const id in animals) {
      const a = animals[id];
      assert(a.nombre, `${id} sin nombre`);
      assert(a.channels && a.channels.length > 0, `${id} sin canales`);
      assert(a.note, `${id} sin nota`);
      for (const ch of a.channels) {
        assert(ch.name, `${id} tiene canal sin nombre`);
        assert(ch.rgb && ch.rgb.length === 3, `${id}/${ch.name} sin rgb`);
        assert(ch.weights, `${id}/${ch.name} sin weights`);
      }
    }
  });

  test('Ningún canal de animal tiene pesos todos a cero', () => {
    const mod = ModuleRegistry.get('ojo-animal');
    const animals = mod.api.getAnimals();
    for (const id in animals) {
      for (const ch of animals[id].channels) {
        const sum = Object.values(ch.weights).reduce((a, b) => a + b, 0);
        assert(sum > 0, `${id}/${ch.name} tiene todos los pesos a 0`);
      }
    }
  });

  // ---- Motor EM: cambio de modo ----
  test('Motor EM: setModeFull y vuelta a mono no petan', () => {
    const mod = ModuleRegistry.get('em-motor');
    try {
      mod.api.setModeFull();
      const wlsFull = mod.api.getActiveWavelengths();
      assert(wlsFull.length === 5, `modo full debería tener 5 λ, tiene ${wlsFull.length}`);
      mod.api.setMode('mono');
      mod.api.setWavelength(550);
      const wlsMono = mod.api.getActiveWavelengths();
      assert(wlsMono.length === 1, `modo mono debería tener 1 λ, tiene ${wlsMono.length}`);
    } catch (e) {
      throw new Error('setModeFull/setMode lanzó: ' + e.message);
    }
  });

  test('Motor EM: modo white tiene 3 λ (450, 550, 650)', () => {
    const mod = ModuleRegistry.get('em-motor');
    mod.api.setMode('white');
    const wls = mod.api.getActiveWavelengths();
    assert(wls.length === 3, `white debería tener 3 λ, tiene ${wls.length}`);
    assert(wls.includes(450) && wls.includes(550) && wls.includes(650),
           `white debería incluir 450/550/650, incluye ${wls.join(',')}`);
    mod.api.setMode('mono');
    mod.api.setWavelength(550);
  });

  // ---- Impresión ----
  const okCount = results.filter(r => r.ok).length;
  const failCount = results.length - okCount;
  console.log(`\n=== TESTS: ${okCount}/${results.length} OK ===`);
  results.forEach(r => {
    if (r.ok) console.log(`✅ ${r.name}`);
    else console.error(`❌ ${r.name}: ${r.error}`);
  });
  console.log('=== Fin de tests ===\n');

  const panel = document.getElementById('test-results');
  const list = document.getElementById('test-list');
  if (panel && list) {
    panel.style.display = 'block';
    list.innerHTML = results.map(r =>
      `<div class="${r.ok ? 'test-ok' : 'test-fail'}">${r.ok ? '✅' : '❌'} ${r.name}${r.ok ? '' : ' — ' + r.error}</div>`
    ).join('') + `<div style="margin-top:8px;color:#aaccff;">Total: ${okCount}/${results.length} OK</div>`;
  }

  return { ok: okCount, fail: failCount, results };
}

// ============================================================================
// SECCIÓN 7 — ARRANQUE
// ============================================================================

window.addEventListener('load', () => {
  runTests();
  const nav = document.getElementById('module-nav');
  const root = document.getElementById('modules-root');
  const orchestrator = new Orchestrator(ModuleRegistry, nav, root);
  orchestrator.boot();
});
</script>
</body>
</html>
