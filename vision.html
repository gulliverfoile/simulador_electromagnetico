<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio de Luz y Visión — Módulos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a1a; color: #e0e0ff; min-height: 100vh;
    background-image: radial-gradient(ellipse at center, #1a1a3a 0%, #050510 100%);
    padding: 20px;
  }
  h1 {
    text-align: center; margin-bottom: 8px; font-size: clamp(1.4rem, 4vw, 1.9rem);
    background: linear-gradient(135deg, #66ddff, #ff66aa, #ffcc00);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; color: #aabbdd; margin-bottom: 20px; font-size: 0.9rem; }
  #module-nav {
    max-width: 1200px; margin: 0 auto 20px;
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    background: rgba(20,20,50,0.6); border: 1px solid rgba(100,100,200,0.3);
    border-radius: 12px; padding: 12px;
  }
  .module-toggle {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 8px;
    background: rgba(30,30,60,0.9); border: 1px solid rgba(150,150,220,0.4);
    cursor: pointer; transition: all 0.2s; user-select: none;
  }
  .module-toggle:hover { background: rgba(50,50,90,0.9); }
  .module-toggle.active {
    background: linear-gradient(135deg, #3a3a7a, #2a2a5a);
    border-color: #66ddff;
    box-shadow: 0 0 12px rgba(100,200,255,0.3);
  }
  .module-toggle input { accent-color: #66ddff; }
  #modules-root { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .module {
    background: rgba(20,20,50,0.85); border: 1px solid rgba(100,100,200,0.3);
    border-radius: 16px; padding: 20px; backdrop-filter: blur(10px);
  }
  .module h2 { font-size: 1.1rem; color: #aaccff; margin-bottom: 12px; }
  .module .desc { font-size: 0.85rem; color: #8899bb; margin-bottom: 12px; line-height: 1.5; }
  canvas { width: 100%; height: auto; border-radius: 8px; background: #04040a; display: block; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .controls button {
    padding: 8px 14px; border-radius: 6px; border: 1px solid rgba(150,150,220,0.4);
    background: rgba(30,30,60,0.9); color: #fff; cursor: pointer; font-size: 0.85rem;
  }
  .controls button:hover { background: rgba(50,50,90,0.9); }
  .controls button.active { background: linear-gradient(135deg, #3a3a7a, #2a2a5a); border-color: #66ddff; }
  .param-group {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
  }
  .param-group label { flex: 0 0 140px; font-size: 0.85rem; color: #aaccff; }
  .param-group input[type="range"] { flex: 1; }
  .param-group span { flex: 0 0 70px; text-align: right; color: #ffcc00; font-family: monospace; font-size: 0.85rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 750px) { .grid-2 { grid-template-columns: 1fr; } }
  .comparison-label { text-align: center; font-size: 0.8rem; color: #8899bb; margin-top: 4px; }
  .info-line {
    font-family: 'Courier New', monospace; font-size: 0.75rem; color: #99bbee;
    margin-top: 8px; background: #0a0a18; padding: 8px; border-radius: 6px;
  }
  footer { text-align: center; margin-top: 30px; color: #556; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>🔬 Laboratorio de Luz y Visión</h1>
<p class="subtitle">Módulos independientes y combinables · Arquitectura hexagonal · Un solo archivo</p>

<nav id="module-nav"></nav>
<main id="modules-root"></main>

<footer>
  Cada módulo es autónomo. Se activan y desactivan desde arriba. La arquitectura permite copiar cada sección a un archivo .js independiente sin reescribir nada.
</footer>

<script>
// ============================================================================
// SECCIÓN 0 — UTILIDADES
// ============================================================================

/** Bus de eventos simple. Mediador entre módulos sin acoplamiento. */
class EventBus {
  constructor() { this.listeners = new Map(); }
  on(evt, cb) {
    if (!this.listeners.has(evt)) this.listeners.set(evt, new Set());
    this.listeners.get(evt).add(cb);
  }
  off(evt, cb) { if (this.listeners.has(evt)) this.listeners.get(evt).delete(cb); }
  emit(evt, payload) {
    const cbs = this.listeners.get(evt);
    if (cbs) cbs.forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
  }
}

/** Longitud de onda (nm) → color RGB aproximado (algoritmo de Dan Bruton). */
function wavelengthToRGB(nm) {
  let R = 0, G = 0, B = 0;
  if (nm >= 380 && nm < 440) { R = -(nm - 440) / 60; B = 1; }
  else if (nm >= 440 && nm < 490) { G = (nm - 440) / 50; B = 1; }
  else if (nm >= 490 && nm < 510) { G = 1; B = -(nm - 510) / 20; }
  else if (nm >= 510 && nm < 580) { R = (nm - 510) / 70; G = 1; }
  else if (nm >= 580 && nm < 645) { R = 1; G = -(nm - 645) / 65; }
  else if (nm >= 645 && nm <= 780) { R = 1; }
  let f = 1;
  if (nm >= 380 && nm < 420) f = 0.3 + 0.7 * (nm - 380) / 40;
  else if (nm > 700 && nm <= 780) f = 0.3 + 0.7 * (780 - nm) / 80;
  return [
    Math.round(255 * Math.pow(R * f, 0.8)),
    Math.round(255 * Math.pow(G * f, 0.8)),
    Math.round(255 * Math.pow(B * f, 0.8)),
  ];
}

// ============================================================================
// SECCIÓN 1 — REGISTRO DE MÓDULOS
// ============================================================================
// Cada módulo se registra aquí. Un módulo declara:
//   - id, nombre, dependencias
//   - mount(ctx): construye su DOM, llamado al activarse
//   - unmount(ctx): limpia, llamado al desactivarse
//   - frame(ctx): opcional, se llama cada frame si está activo
//   - api: opcional, funciones públicas para otros módulos
// El registro NO conoce el DOM ni la simulación. Solo almacena.

const ModuleRegistry = (() => {
  const modules = new Map();
  return {
    add(id, def) { modules.set(id, { id, ...def }); },
    get(id) { return modules.get(id); },
    all() { return [...modules.values()]; },
  };
})();

// ============================================================================
// SECCIÓN 2 — ORQUESTADOR
// ============================================================================
// Monta la UI, gestiona activación/desactivación, respeta dependencias,
// llama a mount/unmount/frame en el momento adecuado.

class Orchestrator {
  constructor(registry, navEl, rootEl) {
    this.registry = registry;
    this.navEl = navEl;
    this.rootEl = rootEl;
    this.bus = new EventBus();
    this.ctx = { bus: this.bus, orchestrator: this };
    this.active = new Map();     // id → { container, api }
    this.animating = false;
  }

  boot() {
    // 1. Construir navegación con checkboxes
    for (const mod of this.registry.all()) {
      const label = document.createElement('label');
      label.className = 'module-toggle';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = mod.activoPorDefecto !== false;
      cb.dataset.id = mod.id;
      const span = document.createElement('span');
      span.textContent = mod.nombre;
      label.appendChild(cb);
      label.appendChild(span);
      label.dataset.id = mod.id;
      if (cb.checked) label.classList.add('active');
      cb.addEventListener('change', () => {
        label.classList.toggle('active', cb.checked);
        if (cb.checked) this.activate(mod.id);
        else this.deactivate(mod.id);
      });
      this.navEl.appendChild(label);
    }

    // 2. Activar los que vienen por defecto, respetando dependencias
    for (const mod of this.registry.all()) {
      if (mod.activoPorDefecto !== false) this.activate(mod.id);
    }

    // 3. Bucle de frame global
    this._startLoop();
  }

  activate(id) {
    if (this.active.has(id)) return;
    const mod = this.registry.get(id);
    if (!mod) return;

    // Comprobar dependencias
    for (const dep of (mod.depende || [])) {
      if (!this.active.has(dep)) {
        // Activar dependencia primero (y su checkbox)
        this.activate(dep);
        const cb = this.navEl.querySelector(`input[data-id="${dep}"]`);
        if (cb && !cb.checked) {
          cb.checked = true;
          cb.parentElement.classList.add('active');
        }
      }
    }

    // Crear contenedor DOM
    const container = document.createElement('div');
    container.className = 'module';
    container.dataset.id = id;
    this.rootEl.appendChild(container);

    const localCtx = { ...this.ctx, container, deps: this._collectAPIs(mod.depende || []) };
    try {
      if (mod.mount) mod.mount(localCtx);
    } catch (e) {
      container.innerHTML = `<p style="color:#f66">Error al montar ${id}: ${e.message}</p>`;
      console.error(e);
      return;
    }

    this.active.set(id, {
      container,
      api: mod.api || null,
      frame: mod.frame || null,
      unmount: mod.unmount || null,
      ctx: localCtx,
    });

    this.bus.emit('module:activated', { id });
  }

  deactivate(id) {
    if (!this.active.has(id)) return;
    const entry = this.active.get(id);
    // No desactivar si otro módulo activo depende de este
    for (const other of this.registry.all()) {
      if (other.id === id) continue;
      if ((other.depende || []).includes(id) && this.active.has(other.id)) {
        console.warn(`No se puede desactivar ${id}: ${other.id} depende de él.`);
        return;
      }
    }
    if (entry.unmount) {
      try { entry.unmount(entry.ctx); } catch (e) { console.error(e); }
    }
    entry.container.remove();
    this.active.delete(id);
    this.bus.emit('module:deactivated', { id });
  }

  _collectAPIs(deps) {
    const apis = {};
    for (const dep of deps) {
      const e = this.active.get(dep);
      if (e && e.api) apis[dep] = e.api;
    }
    return apis;
  }

  _startLoop() {
    const loop = () => {
      for (const [id, entry] of this.active) {
        if (entry.frame) {
          try { entry.frame(entry.ctx); } catch (e) { console.error(`Error en frame de ${id}:`, e); }
        }
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

// ============================================================================
// SECCIÓN 3 — MÓDULO: em-motor
// ============================================================================
// Motor FDTD 2D en modo TM (Ez, Hx, Hy) con esquema de Yee.
// Genera el campo electromagnético. Otros módulos leen el campo.
// No sabe nada de color, ni de percepción, ni de DOM.

(() => {
  /**
   * Solver FDTD 2D TM. Grid escalonado.
   *   Ez en (i, j)
   *   Hx en (i, j+0.5)
   *   Hy en (i+0.5, j)
   * Unidades normalizadas: c = ε₀ = μ₀ = 1.
   */
  class FDTD {
    constructor(nx, nz) {
      const n = nx * nz;
      this.nx = nx; this.nz = nz;
      this.ez = new Float32Array(n);
      this.hx = new Float32Array(n);
      this.hy = new Float32Array(n);
      this.eps = new Float32Array(n).fill(1);
      this.damp = new Float32Array(n);
      this.time = 0;
      this._buildSponge();
    }
    _buildSponge() {
      const { nx, nz } = this;
      const W = 18, MD = 0.12;
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
        const d = Math.min(i, nx - 1 - i, j, nz - 1 - j);
        if (d < W) { const t = (W - d) / W; this.damp[i + j * nx] = MD * t * t * t; }
      }
    }
    setEpsilon(fn) {
      for (let j = 0; j < this.nz; j++) for (let i = 0; i < this.nx; i++) {
        this.eps[i + j * this.nx] = fn(i, j);
      }
    }
    reset() { this.ez.fill(0); this.hx.fill(0); this.hy.fill(0); this.time = 0; }
    step(sourceFn, dt = 0.3535) {
      const { nx, nz, ez, hx, hy, eps, damp } = this;
      // Hx ← -∇Ez (dirección z)
      for (let j = 0; j < nz - 1; j++) for (let i = 0; i < nx; i++) {
        const idx = i + j * nx;
        hx[idx] -= dt * (ez[idx + nx] - ez[idx]);
      }
      // Hy ← +∇Ez (dirección x)
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx - 1; i++) {
        const idx = i + j * nx;
        hy[idx] += dt * (ez[idx + 1] - ez[idx]);
      }
      // Ez ← ∇×H
      for (let j = 1; j < nz - 1; j++) for (let i = 1; i < nx - 1; i++) {
        const idx = i + j * nx;
        ez[idx] += dt / eps[idx] * ((hy[idx] - hy[idx - 1]) - (hx[idx] - hx[idx - nx]));
        const d = damp[idx];
        if (d) { ez[idx] *= (1 - d); hx[idx] *= (1 - d); hy[idx] *= (1 - d); }
      }
      // Fuente puntual en el centro
      if (sourceFn) {
        const ci = (nx / 2) | 0, cj = (nz / 2) | 0;
        ez[ci + cj * nx] += sourceFn(this.time);
      }
      this.time += dt;
    }
  }

  // --- Escenarios: cómo varía ε en el espacio ---
  const scenarios = {
    vacio(i, j, nx, nz) { return 1; },
    lamina(i, j, nx, nz) { return (i > nx * 0.6 && i < nx * 0.75) ? 4 : 1; },
    prisma(i, j, nx, nz) {
      const x = i / nx, y = j / nz;
      // Triángulo con base en x=0.5, vértice en x=0.75
      if (x > 0.4 && x < 0.8 && y > 0.2 && y < 0.8) {
        const left = 0.4, right = 0.8, apex = 0.65;
        const h = 1 - Math.abs((x - apex) / (right - left));
        if (y > 0.5 - h * 0.4 && y < 0.5 + h * 0.4) return 4;
      }
      return 1;
    },
    lente(i, j, nx, nz) {
      const cx = nx * 0.65, cy = nz * 0.5;
      const dx = i - cx, dy = j - cy;
      const d2 = dx * dx + dy * dy;
      const R = Math.min(nx, nz) * 0.15;
      return d2 < R * R ? 4 : 1;
    },
  };

  // --- Fuente: pulso gaussiano modulado (paquete de onda) ---
  function makeSource(freq) {
    const t0 = 3 / freq, tau = 1.2 / freq;
    return (t) => {
      const a = (t - t0) / tau;
      return Math.sin(2 * Math.PI * freq * (t - t0)) * Math.exp(-a * a);
    };
  }

  // --- Estado interno del módulo ---
  const NX = 110, NZ = 90;
  const sims = [];      // 1 o 3 instancias según el modo
  let mode = 'mono';    // 'mono' | 'white'
  let scenarioName = 'lamina';
  let wavelengthNm = 550;  // por defecto, verde
  let running = true;
  let stepsPerFrame = 3;

  // Mapa: longitud de onda (nm) → frecuencia FDTD y ε base
  // Dispersión simple: más refringente para azul, menos para rojo.
  const WL_TABLE = {
    650: { freq: 0.04, eps: 3.6, nm: 650 },   // rojo
    550: { freq: 0.05, eps: 4.0, nm: 550 },   // verde
    450: { freq: 0.06, eps: 4.5, nm: 450 },   // azul
  };

  function buildSims() {
    sims.length = 0;
    if (mode === 'white') {
      for (const key of [650, 550, 450]) {
        const wl = WL_TABLE[key];
        const s = new FDTD(NX, NZ);
        s.wavelengthNm = wl.nm;
        s.color = wavelengthToRGB(wl.nm);
        s.source = makeSource(wl.freq);
        s.setEpsilon((i, j) => {
          const base = scenarios[scenarioName](i, j, NX, NZ);
          if (base === 1) return 1;
          // Escalar ε según longitud de onda (dispersión)
          return 1 + (base - 1) * (wl.eps / 4.0);
        });
        sims.push(s);
      }
    } else {
      const wl = WL_TABLE[wavelengthNm];
      const s = new FDTD(NX, NZ);
      s.wavelengthNm = wl.nm;
      s.color = wavelengthToRGB(wl.nm);
      s.source = makeSource(wl.freq);
      s.setEpsilon((i, j) => scenarios[scenarioName](i, j, NX, NZ));
      sims.push(s);
    }
  }

  function resetSims() {
    for (const s of sims) s.reset();
  }

  // API pública del módulo (lo que otros ven)
  const api = {
    getFields() {
      return sims.map(s => ({ field: s.ez, nx: s.nx, nz: s.nz, color: s.color, wavelength: s.wavelengthNm }));
    },
    setScenario(name) { scenarioName = name; rebuild(); },
    setWavelength(nm) { wavelengthNm = nm; rebuild(); },
    setMode(m) { mode = m; rebuild(); },
    setRunning(r) { running = r; },
    reset() { resetSims(); },
    getScenario() { return scenarioName; },
    getMode() { return mode; },
    getWavelength() { return wavelengthNm; },
  };

  function rebuild() { buildSims(); }

  // --- Registro del módulo ---
  ModuleRegistry.add('em-motor', {
    nombre: '⚡ Motor EM (FDTD)',
    depende: [],
    activoPorDefecto: true,
    api,

    mount(ctx) {
      ctx.container.innerHTML = `
        <h2>⚡ Motor electromagnético 2D · FDTD (Yee) · Modo TM</h2>
        <div class="desc">
          Resuelve las ecuaciones de Maxwell en 2D sobre un grid escalonado. Genera el campo
          electromagnético que los demás módulos usan. Por sí solo no dibuja nada: expone el
          campo a quien lo pida. Los controles de abajo modifican el medio y la fuente.
        </div>
        <div class="controls" id="scenario-controls">
          <button data-scenario="vacio">Vacío</button>
          <button data-scenario="lamina" class="active">Lámina dieléctrica</button>
          <button data-scenario="prisma">Prisma</button>
          <button data-scenario="lente">Lente</button>
        </div>
        <div class="controls" id="mode-controls">
          <button data-mode="mono" class="active">Luz monocromática</button>
          <button data-mode="white">Luz blanca (3 λ)</button>
        </div>
        <div class="controls" id="wavelength-controls">
          <button data-wl="650">Rojo 650nm</button>
          <button data-wl="550" class="active">Verde 550nm</button>
          <button data-wl="450">Azul 450nm</button>
        </div>
        <div class="controls">
          <button id="em-reset">Reiniciar simulación</button>
          <button id="em-play">Pausar</button>
        </div>
        <div class="info-line" id="em-info">Configurando…</div>
      `;

      const sc = ctx.container.querySelector('#scenario-controls');
      sc.addEventListener('click', (e) => {
        if (!e.target.dataset.scenario) return;
        sc.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        api.setScenario(e.target.dataset.scenario);
      });

      const mc = ctx.container.querySelector('#mode-controls');
      mc.addEventListener('click', (e) => {
        if (!e.target.dataset.mode) return;
        mc.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        api.setMode(e.target.dataset.mode);
        // Si pasamos a blanco, desactivar visualmente el selector de λ
        ctx.container.querySelector('#wavelength-controls').style.opacity =
          e.target.dataset.mode === 'white' ? 0.4 : 1;
      });

      const wc = ctx.container.querySelector('#wavelength-controls');
      wc.addEventListener('click', (e) => {
        if (!e.target.dataset.wl) return;
        wc.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        api.setWavelength(parseInt(e.target.dataset.wl, 10));
      });

      ctx.container.querySelector('#em-reset').addEventListener('click', () => api.reset());
      const playBtn = ctx.container.querySelector('#em-play');
      playBtn.addEventListener('click', () => {
        running = !running;
        playBtn.textContent = running ? 'Pausar' : 'Reanudar';
      });

      buildSims();
    },

    frame(ctx) {
      if (!running) return;
      for (let k = 0; k < stepsPerFrame; k++) {
        for (const s of sims) s.step(s.source);
      }
      // Actualizar la línea de info
      const info = ctx.container.querySelector('#em-info');
      if (info) {
        info.textContent =
          `Escenario: ${scenarioName} · Modo: ${mode} · ` +
          (mode === 'mono' ? `λ = ${wavelengthNm} nm · ` : `3 longitudes de onda · `) +
          `Grid ${NX}×${NZ} · t = ${sims[0]?.time.toFixed(2) || 0}`;
      }
    },
  });
})();

// ============================================================================
// SECCIÓN 4 — MÓDULO: em-color
// ============================================================================
// Lee el campo del motor EM y lo pinta en color.
// Enseña que la onda tiene frecuencia, pero el color lo pone el observador:
// se aplica una función de conversión longitud de onda → RGB (ojo humano).

(() => {
  let canvas, ctx2d, imageData, offscreen, offCtx;
  const CW = 110, CH = 90; // debe coincidir con NX, NZ del motor

  function ensureCanvas(w, h) {
    if (!canvas || canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      offscreen = document.createElement('canvas');
      offscreen.width = w; offscreen.height = h;
      offCtx = offscreen.getContext('2d');
      imageData = offCtx.createImageData(w, h);
    }
  }

  ModuleRegistry.add('em-color', {
    nombre: '🎨 Color (percepción humana)',
    depende: ['em-motor'],
    activoPorDefecto: true,

    mount(c) {
      c.container.innerHTML = `
        <h2>🎨 Color — de onda a percepción</h2>
        <div class="desc">
          El motor EM produce <em>frecuencias</em>. El <strong>color</strong> no está en la onda:
          está en el ojo que la mira. Este módulo aplica la conversión longitud de onda → RGB
          que aproxima la respuesta de los conos humanos. En modo monocromático ves la onda en su
          color percibido. En modo luz blanca ves la superposición de tres simulaciones (rojo,
          verde, azul) corriendo en paralelo — útil para ver dispersión en el prisma.
        </div>
        <canvas id="em-color-canvas"></canvas>
        <div class="info-line" id="color-info">Esperando datos del motor…</div>
      `;
      canvas = c.container.querySelector('#em-color-canvas');
      ctx2d = canvas.getContext('2d');
    },

    frame(c) {
      const motor = c.deps['em-motor'];
      if (!motor) return;
      const fields = motor.getFields();
      if (!fields.length) return;

      ensureCanvas(fields[0].nx, fields[0].nz);
      const data = imageData.data;

      // Encontrar máximo global para normalizar
      let maxV = 1e-20;
      for (const f of fields) {
        for (let k = 0; k < f.field.length; k++) {
          const a = Math.abs(f.field[k]);
          if (a > maxV) maxV = a;
        }
      }
      const inv = 1 / maxV;

      // Pintar cada celda
      for (let k = 0; k < fields[0].field.length; k++) {
        let r = 0, g = 0, b = 0;
        for (const f of fields) {
          const v = Math.min(1, Math.abs(f.field[k]) * inv);
          r += f.color[0] * v;
          g += f.color[1] * v;
          b += f.color[2] * v;
        }
        const p = k * 4;
        data[p] = Math.min(255, r);
        data[p + 1] = Math.min(255, g);
        data[p + 2] = Math.min(255, b);
        data[p + 3] = 255;
      }
      offCtx.putImageData(imageData, 0, 0);
      ctx2d.imageSmoothingEnabled = true;
      ctx2d.drawImage(offscreen, 0, 0, canvas.width, canvas.height);

      const info = c.container.querySelector('#color-info');
      if (info) {
        const mode = motor.getMode();
        info.textContent = mode === 'white'
          ? `Modo luz blanca: 3 simulaciones superpuestas (R 650nm, G 550nm, B 450nm)`
          : `Modo monocromático: λ = ${motor.getWavelength()} nm → RGB [${wavelengthToRGB(motor.getWavelength()).join(', ')}]`;
      }
    },
  });
})();

// ============================================================================
// SECCIÓN 5 — MÓDULO: percepcion
// ============================================================================
// Simula cómo ve el mundo una persona con distintas condiciones visuales.
// No depende del motor EM. Trabaja con imágenes. Permite comparar, ajustar
// severidad y probar compensaciones.
//
// Condiciones implementadas:
//   - Degeneración macular seca: borrón + mancha central
//   - Degeneración macular húmeda: distorsión central (metamorfopsia) + mancha
//   - Glaucoma: pérdida de visión periférica (efecto túnel)
//   - Cataratas: borrón global + tinte amarillento + menos contraste
//   - Retinosis pigmentaria: pérdida de periferia + túnel progresivo
//   - Daltonismo (protanopia / deuteranopia / tritanopia): matrices de color
//
// Aviso: es educativo. No es diagnóstico ni producto sanitario.

(() => {
  // --- Generar escena de prueba ---
  function generateScene(w, h) {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');

    // Cielo degradado
    const sky = g.createLinearGradient(0, 0, 0, h * 0.62);
    sky.addColorStop(0, '#5B9BD5');
    sky.addColorStop(0.7, '#B8D4E8');
    sky.addColorStop(1, '#F5DEB3');
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h * 0.62);

    // Sol
    g.fillStyle = '#FFD966';
    g.beginPath(); g.arc(w * 0.82, h * 0.15, Math.min(w, h) * 0.06, 0, Math.PI * 2); g.fill();

    // Montañas
    g.fillStyle = '#6B5B4A';
    g.beginPath();
    g.moveTo(0, h * 0.62);
    g.lineTo(w * 0.15, h * 0.38);
    g.lineTo(w * 0.28, h * 0.55);
    g.lineTo(w * 0.42, h * 0.32);
    g.lineTo(w * 0.55, h * 0.52);
    g.lineTo(w * 0.72, h * 0.4);
    g.lineTo(w * 0.88, h * 0.55);
    g.lineTo(w, h * 0.45);
    g.lineTo(w, h * 0.62);
    g.closePath(); g.fill();

    // Suelo
    g.fillStyle = '#7CB342';
    g.fillRect(0, h * 0.62, w, h * 0.38);

    // Casa
    g.fillStyle = '#F5DEB3';
    g.fillRect(w * 0.22, h * 0.6, w * 0.16, h * 0.22);
    g.fillStyle = '#A0522D';
    g.beginPath();
    g.moveTo(w * 0.20, h * 0.6);
    g.lineTo(w * 0.30, h * 0.46);
    g.lineTo(w * 0.40, h * 0.6);
    g.closePath(); g.fill();
    g.fillStyle = '#5D4037';
    g.fillRect(w * 0.28, h * 0.72, w * 0.04, h * 0.1);
    g.fillStyle = '#81D4FA';
    g.fillRect(w * 0.24, h * 0.66, w * 0.03, h * 0.03);

    // Árbol
    g.fillStyle = '#5D4037';
    g.fillRect(w * 0.72, h * 0.66, w * 0.02, h * 0.16);
    g.fillStyle = '#2E7D32';
    g.beginPath(); g.arc(w * 0.73, h * 0.6, w * 0.06, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(w * 0.68, h * 0.63, w * 0.045, 0, Math.PI * 2); g.fill();

    // Cara simplificada en el centro (para reconocimiento facial)
    const faceX = w * 0.5, faceY = h * 0.5, faceR = Math.min(w, h) * 0.09;
    g.fillStyle = '#FFCC99';
    g.beginPath(); g.arc(faceX, faceY, faceR, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#000';
    g.beginPath(); g.arc(faceX - faceR * 0.35, faceY - faceR * 0.2, faceR * 0.1, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(faceX + faceR * 0.35, faceY - faceR * 0.2, faceR * 0.1, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#000'; g.lineWidth = 2;
    g.beginPath(); g.arc(faceX, faceY + faceR * 0.1, faceR * 0.5, 0.2, Math.PI - 0.2); g.stroke();

    // Texto de prueba
    g.fillStyle = '#FFFFFF';
    g.font = `bold ${Math.round(h * 0.06)}px sans-serif`;
    g.fillText('TEXTO', w * 0.05, h * 0.95);
    g.font = `${Math.round(h * 0.04)}px sans-serif`;
    g.fillText('abc 123', w * 0.55, h * 0.95);

    return cv;
  }

  // --- Filtros: cada uno recibe un ctx 2D ya con la escena dibujada ---
  const filters = {
    normal(g, w, h, sev, comp) { /* nada */ },

    'macular-seca'(g, w, h, sev, comp) {
      const s = sev / 100;
      const cx = w / 2, cy = h / 2;
      const R = Math.min(w, h) * (0.15 + 0.15 * s);
      // Borrón central
      if (s > 0.1) {
        const snap = document.createElement('canvas');
        snap.width = w; snap.height = h;
        snap.getContext('2d').drawImage(g.canvas, 0, 0);
        g.save();
        g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
        g.filter = `blur(${2 + 8 * s}px)`;
        g.drawImage(snap, 0, 0);
        g.filter = 'none';
        g.restore();
      }
      // Mancha central oscura
      const grad = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
      grad.addColorStop(0, `rgba(0,0,0,${0.3 + 0.6 * s})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      // Compensación: aumentar contraste periférico
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'overlay';
        g.fillStyle = 'rgba(255,255,255,0.15)';
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    'macular-humeda'(g, w, h, sev, comp) {
      const s = sev / 100;
      const cx = w / 2, cy = h / 2;
      const R = Math.min(w, h) * (0.15 + 0.1 * s);
      // Distorsión (metamorfopsia): remapear píxeles en un anillo central
      const snap = document.createElement('canvas');
      snap.width = w; snap.height = h;
      snap.getContext('2d').drawImage(g.canvas, 0, 0);
      const srcCtx = snap.getContext('2d');
      const src = srcCtx.getImageData(0, 0, w, h);
      const dst = g.createImageData(w, h);
      const srcD = src.data, dstD = dst.data;
      const k = 0.3 * s;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const dx = x - cx, dy = y - cy;
          const d = Math.hypot(dx, dy);
          const idx = (y * w + x) * 4;
          if (d < R && d > 0.1) {
            const theta = Math.atan2(dy, dx);
            const wave = 1 + k * Math.sin(d * 0.4);
            const nx2 = cx + Math.cos(theta) * d * wave;
            const ny2 = cy + Math.sin(theta) * d * wave;
            const sx = Math.max(0, Math.min(w - 1, Math.round(nx2)));
            const sy = Math.max(0, Math.min(h - 1, Math.round(ny2)));
            const si = (sy * w + sx) * 4;
            dstD[idx] = srcD[si];
            dstD[idx + 1] = srcD[si + 1];
            dstD[idx + 2] = srcD[si + 2];
            dstD[idx + 3] = 255;
          } else {
            dstD[idx] = srcD[idx];
            dstD[idx + 1] = srcD[idx + 1];
            dstD[idx + 2] = srcD[idx + 2];
            dstD[idx + 3] = 255;
          }
        }
      }
      g.putImageData(dst, 0, 0);
      // Mancha oscura
      const grad = g.createRadialGradient(cx, cy, R * 0.3, cx, cy, R);
      grad.addColorStop(0, `rgba(0,0,0,${0.2 + 0.5 * s})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'overlay';
        g.fillStyle = 'rgba(255,255,255,0.15)';
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    glaucoma(g, w, h, sev, comp) {
      const s = sev / 100;
      const cx = w / 2, cy = h / 2;
      const outer = Math.hypot(w, h) / 2;
      const inner = outer * (0.9 - 0.7 * s);
      const grad = g.createRadialGradient(cx, cy, inner, cx, cy, outer);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.98)');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      if (comp) {
        // Compensación simple: iluminar un poco más la zona central
        g.save();
        g.globalCompositeOperation = 'screen';
        const g2 = g.createRadialGradient(cx, cy, 0, cx, cy, inner);
        g2.addColorStop(0, 'rgba(255,255,255,0.2)');
        g2.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = g2;
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    cataratas(g, w, h, sev, comp) {
      const s = sev / 100;
      // Borrón global
      if (s > 0.05) {
        const snap = document.createElement('canvas');
        snap.width = w; snap.height = h;
        snap.getContext('2d').drawImage(g.canvas, 0, 0);
        g.filter = `blur(${1 + 6 * s}px)`;
        g.drawImage(snap, 0, 0);
        g.filter = 'none';
      }
      // Tinte amarillento y pérdida de contraste
      g.save();
      g.globalCompositeOperation = 'multiply';
      g.fillStyle = `rgba(255, 230, 150, ${0.15 + 0.35 * s})`;
      g.fillRect(0, 0, w, h);
      g.restore();
      // Compensación: boost de contraste y saturación
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'overlay';
        g.fillStyle = `rgba(100,100,255,${0.1 + 0.15 * s})`;
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    'retinosis'(g, w, h, sev, comp) {
      const s = sev / 100;
      const cx = w / 2, cy = h / 2;
      const outer = Math.hypot(w, h) / 2;
      // Pérdida de periferia: anillo oscuro pero con algo de visión
      const inner = outer * (0.85 - 0.55 * s);
      const grad = g.createRadialGradient(cx, cy, inner, cx, cy, outer);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.7, `rgba(0,0,0,${0.5 + 0.3 * s})`);
      grad.addColorStop(1, `rgba(0,0,0,${0.85 + 0.15 * s})`);
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      if (comp) {
        g.save();
        g.globalCompositeOperation = 'screen';
        const g2 = g.createRadialGradient(cx, cy, 0, cx, cy, inner);
        g2.addColorStop(0, 'rgba(255,255,255,0.15)');
        g2.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = g2;
        g.fillRect(0, 0, w, h);
        g.restore();
      }
    },

    daltonismo(g, w, h, sev, comp, subtype) {
      const s = sev / 100;
      const img = g.getImageData(0, 0, w, h);
      const d = img.data;
      // Matrices (protanopia, deuteranopia, tritanopia)
      // Fuente: Machado et al., simplificadas. Mezcla con identidad según severidad.
      const M = {
        protanopia:  [[0.567,0.433,0], [0.558,0.442,0], [0,0.242,0.758]],
        deuteranopia:[[0.625,0.375,0], [0.7,0.3,0], [0,0.3,0.7]],
        tritanopia:  [[0.95,0.05,0], [0,0.433,0.567], [0,0.475,0.525]],
      };
      const mix = (r,g,b, mat, s) => {
        const id = [[1,0,0],[0,1,0],[0,0,1]];
        const blend = (i,j) => id[i][j] * (1-s) + mat[i][j] * s;
        return [
          blend(0,0)*r + blend(0,1)*g + blend(0,2)*b,
          blend(1,0)*r + blend(1,1)*g + blend(1,2)*b,
          blend(2,0)*r + blend(2,1)*g + blend(2,2)*b,
        ];
      };
      for (let i = 0; i < d.length; i += 4) {
        const [r, g2, b] = mix(d[i], d[i+1], d[i+2], M[subtype], s);
        d[i] = Math.max(0, Math.min(255, r));
        d[i+1] = Math.max(0, Math.min(255, g2));
        d[i+2] = Math.max(0, Math.min(255, b));
      }
      g.putImageData(img, 0, 0);
      if (comp) {
        // Compensación aproximada tipo "filtro EnChroma": remapear canales
        const img2 = g.getImageData(0, 0, w, h);
        const d2 = img2.data;
        for (let i = 0; i < d2.length; i += 4) {
          const r = d2[i], g2 = d2[i+1], b = d2[i+2];
          // Aumentar separación R-G (aumenta contraste rojo-verde)
          const boost = 1.4;
          d2[i]   = Math.min(255, 128 + (r - 128) * boost);
          d2[i+1] = Math.min(255, 128 + (g2 - 128) * boost);
          d2[i+2] = b;
        }
        g.putImageData(img2, 0, 0);
      }
    },
  };

  // --- Estado del módulo ---
  const STATE = {
    condition: 'normal',
    severity: 50,
    compensation: false,
    daltonSubtype: 'protanopia',
    sourceCanvas: null,
  };

  ModuleRegistry.add('percepcion', {
    nombre: '👁 Percepción visual',
    depende: [],
    activoPorDefecto: true,

    mount(c) {
      c.container.innerHTML = `
        <h2>👁 Percepción visual — condiciones y compensación</h2>
        <div class="desc">
          Muestra cómo ve el mundo una persona con distintas condiciones visuales.
          Compara lado a lado <strong>normal</strong> vs <strong>simulado</strong>.
          Activa <em>compensación</em> para ver intentos de mejora (contraste, remapeo).
          <strong>Aviso:</strong> educativo, no diagnóstico.
        </div>
        <div class="controls" id="cond-controls">
          <button data-cond="normal" class="active">Normal</button>
          <button data-cond="macular-seca">Macular seca</button>
          <button data-cond="macular-humeda">Macular húmeda</button>
          <button data-cond="glaucoma">Glaucoma</button>
          <button data-cond="cataratas">Cataratas</button>
          <button data-cond="retinosis">Retinosis pigmentaria</button>
          <button data-cond="daltonismo">Daltonismo</button>
        </div>
        <div class="controls" id="dalton-controls" style="display:none">
          <button data-sub="protanopia" class="active">Protanopia</button>
          <button data-sub="deuteranopia">Deuteranopia</button>
          <button data-sub="tritanopia">Tritanopia</button>
        </div>
        <div class="param-group">
          <label>Severidad</label>
          <input type="range" id="severity" min="0" max="100" value="50">
          <span id="severity-value">50</span>
        </div>
        <label class="module-toggle" style="margin-top:8px; width:auto; display:inline-flex;">
          <input type="checkbox" id="comp-toggle">
          <span>Activar compensación</span>
        </label>
        <div class="grid-2" style="margin-top:12px;">
          <div>
            <canvas id="canvas-normal"></canvas>
            <div class="comparison-label">Visión normal</div>
          </div>
          <div>
            <canvas id="canvas-sim"></canvas>
            <div class="comparison-label" id="sim-label">Simulación: ninguna</div>
          </div>
        </div>
        <div class="info-line" id="perception-info">
          Generando escena de prueba…
        </div>
      `;

      // Generar escena
      const sceneW = 480, sceneH = 320;
      STATE.sourceCanvas = generateScene(sceneW, sceneH);

      const cn = c.container.querySelector('#canvas-normal');
      const cs = c.container.querySelector('#canvas-sim');
      cn.width = cs.width = sceneW;
      cn.height = cs.height = sceneH;

      // Dibujar "normal" una sola vez
      cn.getContext('2d').drawImage(STATE.sourceCanvas, 0, 0);

      // Controles de condición
      const cc = c.container.querySelector('#cond-controls');
      const dc = c.container.querySelector('#dalton-controls');
      cc.addEventListener('click', (e) => {
        if (!e.target.dataset.cond) return;
        cc.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        STATE.condition = e.target.dataset.cond;
        dc.style.display = STATE.condition === 'daltonismo' ? 'flex' : 'none';
        render(c);
      });

      // Submenú daltonismo
      dc.addEventListener('click', (e) => {
        if (!e.target.dataset.sub) return;
        dc.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        STATE.daltonSubtype = e.target.dataset.sub;
        render(c);
      });

      // Slider severidad
      const sev = c.container.querySelector('#severity');
      const sevVal = c.container.querySelector('#severity-value');
      sev.addEventListener('input', () => {
        STATE.severity = parseInt(sev.value, 10);
        sevVal.textContent = STATE.severity;
        render(c);
      });

      // Toggle compensación
      const comp = c.container.querySelector('#comp-toggle');
      comp.addEventListener('change', () => {
        STATE.compensation = comp.checked;
        render(c);
      });

      render(c);
    },
  });

  function render(c) {
    const cs = c.container.querySelector('#canvas-sim');
    const info = c.container.querySelector('#perception-info');
    const label = c.container.querySelector('#sim-label');
    const g = cs.getContext('2d');

    // Limpiar
    g.clearRect(0, 0, cs.width, cs.height);

    // Dibujar escena original
    g.drawImage(STATE.sourceCanvas, 0, 0);

    // Aplicar filtro
    const filter = filters[STATE.condition];
    if (filter) {
      try {
        filter(g, cs.width, cs.height, STATE.severity, STATE.compensation, STATE.daltonSubtype);
      } catch (e) {
        console.error('Error al aplicar filtro:', e);
      }
    }

    // Actualizar etiquetas
    const names = {
      normal: 'Normal',
      'macular-seca': 'Degeneración macular (seca)',
      'macular-humeda': 'Degeneración macular (húmeda)',
      glaucoma: 'Glaucoma (visión en túnel)',
      cataratas: 'Cataratas',
      retinosis: 'Retinosis pigmentaria',
      daltonismo: `Daltonismo (${STATE.daltonSubtype})`,
    };
    label.textContent = `Simulación: ${names[STATE.condition]}` +
      (STATE.compensation ? ' · con compensación' : '');

    info.textContent =
      `Condición: ${names[STATE.condition]} · ` +
      `Severidad: ${STATE.severity}% · ` +
      `Compensación: ${STATE.compensation ? 'ON' : 'OFF'}`;
  }
})();

// ============================================================================
// SECCIÓN 6 — ARRANQUE
// ============================================================================

window.addEventListener('load', () => {
  const nav = document.getElementById('module-nav');
  const root = document.getElementById('modules-root');
  const orchestrator = new Orchestrator(ModuleRegistry, nav, root);
  orchestrator.boot();
});
</script>
